<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arize18 Travel and Tours | Under Construction</title>
    <meta name="description" content="Arize18 Travel and Tours is currently updating the website. Please check back soon.">
    <style>
        :root {
            --navy: #1B2B4B;
            --navy-dark: #111D32;
            --navy-light: #243860;
            --red: #C8202F;
            --red-dark: #A01825;
            --white: #FFFFFF;
            --off-white: #F5F5F7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Barlow", "Segoe UI", sans-serif;
            color: var(--white);
            background: radial-gradient(circle at 15% 20%, var(--navy-light) 0%, transparent 42%),
                        radial-gradient(circle at 85% 80%, var(--red-dark) 0%, transparent 36%),
                        linear-gradient(140deg, var(--navy-dark) 0%, var(--navy) 58%, #1d3158 100%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .wrap {
            width: 100%;
            max-width: 760px;
            background: rgba(17, 29, 50, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-top: 4px solid var(--red);
            border-radius: 18px;
            padding: 28px;
            backdrop-filter: blur(4px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .logo {
            width: min(340px, 80%);
            height: auto;
            display: block;
            margin: 0 auto 18px;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.35));
        }

        h1 {
            margin: 8px 0 12px;
            font-size: clamp(1.6rem, 4vw, 2.5rem);
            line-height: 1.15;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .line {
            width: 88px;
            height: 4px;
            margin: 0 auto 16px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--red) 0%, #ef4a57 100%);
        }

        p {
            margin: 0 auto;
            max-width: 58ch;
            color: var(--off-white);
            font-size: clamp(1rem, 2.4vw, 1.1rem);
            line-height: 1.7;
        }

        .badge {
            margin: 22px auto 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--white);
            background: linear-gradient(120deg, var(--red) 0%, var(--red-dark) 100%);
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 0.78rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--white);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.65); }
        }

        .footer {
            margin-top: 16px;
            color: rgba(245, 245, 247, 0.9);
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
    <main class="wrap">
        <img src="images/logo-white.png" alt="Arize18 Travel and Tours logo" class="logo">
        <h1>Website Under Construction</h1>
        <div class="line" aria-hidden="true"></div>
        <p>
            Arize18 Travel and Tours is making improvements to serve you better.
            Our team is currently updating this website. Please check back soon.
        </p>
        <div class="badge" role="status" aria-live="polite">
            <span class="dot" aria-hidden="true"></span>
            We are working on it
        </div>
        <div class="footer">Arize18 Travel and Tours</div>
    </main>
</body>
</html>
